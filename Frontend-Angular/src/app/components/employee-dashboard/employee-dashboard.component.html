<div class="dashboard-container">
  <h1 class="welcome-text">🏦 Welcome to Citi Bank! 🚀</h1>
  
  <div class="dashboard-card">
      <h2>Employee Dashboard</h2>

      <div class="dashboard-content">
          <div class="card">
              <i class="fas fa-user-plus icon"></i>
              <h3>Add Customer</h3>
              <button routerLink="/add-customer" class="btn btn-primary">Add Customer</button>
          </div>

          <div class="card">
              <i class="fas fa-users icon"></i>
              <h3>View Customers</h3>
              <button routerLink="/view-customers" class="btn btn-secondary">View Customers</button>
          </div>

          <div class="card logout-card">
              <i class="fas fa-sign-out-alt icon"></i>
              <h3>Logout</h3>
              <button (click)="logout()" class="btn btn-danger">Logout</button>
          </div>
      </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
      <p>© 2025 Naheda Pathan | Banking System</p>
  </footer>
</div>
