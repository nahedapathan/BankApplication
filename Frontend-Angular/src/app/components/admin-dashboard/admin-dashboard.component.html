<div class="dashboard-container">
  <h2 class="dashboard-title">🏦 Welcome to Citi Bank Admin Dashboard</h2>

  <div class="dashboard-buttons">
      <div class="card">
          <h3>Add Employee</h3>
          <button routerLink="/add-employee" class="btn btn-primary">Add Employee</button>
      </div>
      <div class="card">
          <h3>View Employees</h3>
          <button routerLink="/view-employee" class="btn btn-secondary">View Employees</button>
      </div>
      <div class="card">
          <h3>Add Customer</h3>
          <button routerLink="/add-customer" class="btn btn-success">Add Customer</button>
      </div>
      <div class="card">
          <h3>View Customers</h3>
          <button routerLink="/view-customers" class="btn btn-warning">View Customers</button>
      </div>
  </div>

  <button (click)="logout()" class="btn btn-danger logout-btn">🚪 Logout</button>

  <footer class="footer">© 2025 Naheda Pathan | Banking System 🏦</footer>
</div>
