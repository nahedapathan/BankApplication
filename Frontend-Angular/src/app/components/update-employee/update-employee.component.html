<h1 style="color: darkblue;font-size: 40px; text-shadow: 3px 0 3px #07acb8;">𝒲𝑒𝓁𝒸𝑜𝓂𝑒 𝓉𝑜 𝒞𝒾𝓉𝒾 𝐵𝒶𝓃𝓀</h1>
              
<div class="update-employee-container">
    <h2 class="update-heading">📝 Update Employee Data</h2>

    <form (ngSubmit)="updateEmployee()" class="update-form">
        <div class="form-group">
            <label>👤 Account Holder Name</label>
            <input type="text" class="form-control" name="name" [(ngModel)]="employee.name" required>
        </div>

        <div class="form-group">
            <label>💼 Position</label>
            <input type="text" class="form-control" name="position" [(ngModel)]="employee.position" required>
        </div>

        <div class="form-group">
            <label>💰 Salary</label>
            <input type="number" class="form-control" name="salary" [(ngModel)]="employee.salary" required>
        </div>

        <div class="form-group">
            <label>👨‍💻 Username</label>
            <input type="text" class="form-control" name="username" [(ngModel)]="employee.username" required>
        </div>

        <div class="form-group">
            <label>🔑 Password</label>
            <input type="password" class="form-control" name="password" [(ngModel)]="employee.password" required>
        </div>

        <div class="text-center">
            <button class="btn btn-update mt-3" type="submit">✅ Update Employee</button>
        </div>
    </form>
</div>
